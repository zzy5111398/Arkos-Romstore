# 由 RomStore 部署：给 ES 的崩溃循环加上限，避免无限空转
# 放在 drop-in 里，不改动厂商原始的 emulationstation.service
#
# 背景：2026-10-11 该掌机出现过 emulationstation 段错误（exit 139）
# 被 Restart=on-failure + RestartSec=100ms 放大成无限重启循环，
# 表现为屏幕反复闪、load average 飙到 3.7、无法使用。
# 加限后：120 秒内最多重启 5 次，仍失败则彻底停下并留下控制台，
# 用户可用 SSH / 组合键恢复，而不是无休止地空转写 SD 卡。

[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
